{{- if .Values.cpuOcrWorker.enabled }}
{{- if ne .Values.cpuOcrWorker.queues "ocr_cpu" }}
{{- fail "cpuOcrWorker.queues must be exactly ocr_cpu; use an explicit replay route instead of cross-lane consumption" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cpu-ocr-worker
  labels:
    {{- include "ocr-local.labels" . | nindent 4 }}
    app.kubernetes.io/component: cpu-ocr-worker
spec:
  {{- if not .Values.cpuOcrWorker.autoscaling.enabled }}
  replicas: {{ .Values.cpuOcrWorker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ocr-local.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cpu-ocr-worker
  template:
    metadata:
      labels:
        {{- include "ocr-local.labels" . | nindent 8 }}
        app.kubernetes.io/component: cpu-ocr-worker
      {{- if .Values.workerSecurity.mTLS.enabled }}
      annotations:
        {{ .Values.workerSecurity.mTLS.annotation }}: {{ .Values.workerSecurity.mTLS.annotationValue | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ocr-local.serviceAccountName" . }}
      {{- include "ocr-local.imagePullSecrets" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.workerTerminationGracePeriodSeconds | default 360 }}
      {{- include "ocr-local.haScheduling" (dict "root" . "component" "cpu-ocr-worker") | nindent 6 }}
      {{- with .Values.cpuOcrWorker.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cpuOcrWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cpuOcrWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: staging-volume
          {{- if eq .Values.workerSecurity.stagingVolume.type "emptyDir" }}
          emptyDir:
            medium: {{ .Values.workerSecurity.stagingVolume.emptyDir.medium }}
            sizeLimit: {{ .Values.workerSecurity.stagingVolume.emptyDir.sizeLimit }}
          {{- else }}
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: [ "ReadWriteOnce" ]
                storageClassName: {{ .Values.workerSecurity.stagingVolume.pvc.storageClass | quote }}
                resources:
                  requests:
                    storage: {{ .Values.workerSecurity.stagingVolume.pvc.size }}
          {{- end }}
        {{- if and (eq .Values.storage.backend "nfs") .Values.storage.nfs.persistence.enabled }}
        - name: nfs-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-nfs-data
        {{- end }}
        {{- include "ocr-local.tlsCaVolume" . | nindent 8 }}
      initContainers:
        {{- include "ocr-local.schemaReadinessInit" (dict "root" . "envKind" "worker" "securityContext" .Values.cpuOcrWorker.containerSecurityContext) | nindent 8 }}
      containers:
        - name: cpu-ocr-worker
          image: {{ include "ocr-local.cpuOcrWorkerImage" . }}
          imagePullPolicy: {{ .Values.image.cpuOcrWorker.pullPolicy | default "IfNotPresent" }}
          command:
            - /usr/bin/tini
            - -g
            - --
            - celery
            - -A
            - coordinator.coordinator
            - worker
            - --loglevel=info
            - --queues={{ .Values.cpuOcrWorker.queues }}
            - --concurrency={{ .Values.cpuOcrWorker.concurrency }}
            - --max-tasks-per-child={{ .Values.cpuOcrWorker.maxTasksPerChild }}
            - --hostname=cpu-ocr-worker@%h
          volumeMounts:
            - name: staging-volume
              mountPath: {{ .Values.workerSecurity.stagingVolume.mountPath }}
            {{- if and (eq .Values.storage.backend "nfs") .Values.storage.nfs.persistence.enabled }}
            - name: nfs-data
              mountPath: {{ .Values.storage.nfs.mountPath | default "/shared" }}
            {{- end }}
            {{- include "ocr-local.tlsCaVolumeMount" . | nindent 12 }}
          {{- include "ocr-local.workerEnvFrom" . | nindent 10 }}
          env:
            {{- include "ocr-local.workerSecretEnv" . | nindent 12 }}
            - name: WORKER_QUEUES
              value: {{ .Values.cpuOcrWorker.queues | quote }}
            - name: WORKER_CONCURRENCY
              value: {{ .Values.cpuOcrWorker.concurrency | quote }}
            {{- if .Values.ocrCapabilitySeparation.enabled }}
            - name: OCR_WORKER_CAPABILITY
              value: "paddle"
            - name: OCR_SEPARATE_TESSERACT_LANE
              value: "true"
            {{- end }}
            - name: FASTTEXT_MODEL_PATH
              value: /app/models/lid.176.bin
            {{- range $key, $val := .Values.cpuOcrWorker.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          startupProbe:
            exec:
              command:
                - python
                - -c
                {{- if .Values.ocrCapabilitySeparation.enabled }}
                - "import importlib.util, pathlib, shutil; import celery, paddle, paddleocr; assert not shutil.which('tesseract'); assert importlib.util.find_spec('pytesseract') is None; assert pathlib.Path.home().joinpath('.paddleocr').is_dir()"
                {{- else }}
                - "import pathlib, shutil; import celery, paddle, paddleocr, pytesseract; assert shutil.which('tesseract'); assert pathlib.Path.home().joinpath('.paddleocr').is_dir()"
                {{- end }}
            failureThreshold: 10
            periodSeconds: 5
            timeoutSeconds: 30
          readinessProbe:
            exec:
              command:
                - python3
                - /app/coordinator/worker_healthcheck.py
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - python3
                - /app/coordinator/worker_healthcheck.py
            periodSeconds: 60
            timeoutSeconds: 15
          resources:
            {{- toYaml .Values.cpuOcrWorker.resources | nindent 12 }}
          {{- with .Values.cpuOcrWorker.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
