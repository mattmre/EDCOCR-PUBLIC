apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cpu-worker
  labels:
    {{- include "ocr-local.labels" . | nindent 4 }}
    app.kubernetes.io/component: cpu-worker
spec:
  {{- if not .Values.cpuWorker.autoscaling.enabled }}
  replicas: {{ .Values.cpuWorker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ocr-local.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cpu-worker
  template:
    metadata:
      labels:
        {{- include "ocr-local.labels" . | nindent 8 }}
        app.kubernetes.io/component: cpu-worker
      {{- if .Values.workerSecurity.mTLS.enabled }}
      annotations:
        {{ .Values.workerSecurity.mTLS.annotation }}: {{ .Values.workerSecurity.mTLS.annotationValue | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ocr-local.serviceAccountName" . }}
      {{- include "ocr-local.imagePullSecrets" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.workerTerminationGracePeriodSeconds | default 360 }}
      {{- include "ocr-local.haScheduling" (dict "root" . "component" "cpu-worker") | nindent 6 }}
      {{- with .Values.cpuWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cpuWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cpuWorker.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: staging-volume
          {{- if eq .Values.workerSecurity.stagingVolume.type "emptyDir" }}
          emptyDir:
            medium: {{ .Values.workerSecurity.stagingVolume.emptyDir.medium }}
            sizeLimit: {{ .Values.workerSecurity.stagingVolume.emptyDir.sizeLimit }}
          {{- else }}
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: [ "ReadWriteOnce" ]
                storageClassName: {{ .Values.workerSecurity.stagingVolume.pvc.storageClass | quote }}
                resources:
                  requests:
                    storage: {{ .Values.workerSecurity.stagingVolume.pvc.size }}
          {{- end }}
        {{- if and (eq .Values.storage.backend "nfs") .Values.storage.nfs.persistence.enabled }}
        - name: nfs-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-nfs-data
        {{- end }}
        {{- include "ocr-local.tlsCaVolume" . | nindent 8 }}
      initContainers:
        {{- include "ocr-local.schemaReadinessInit" (dict "root" . "envKind" "worker" "securityContext" .Values.cpuWorker.containerSecurityContext) | nindent 8 }}
      containers:
        - name: cpu-worker
          image: {{ include "ocr-local.workerImage" . }}
          imagePullPolicy: {{ .Values.image.worker.pullPolicy | default "IfNotPresent" }}
          command:
            - /usr/bin/tini
            - -g
            - --
            - celery
            - -A
            - coordinator.coordinator
            - worker
            - --loglevel=info
            - --queues={{ .Values.cpuWorker.queues }}
            - --concurrency={{ .Values.cpuWorker.concurrency }}
            - --hostname=cpu-worker@%h
          volumeMounts:
            - name: staging-volume
              mountPath: {{ .Values.workerSecurity.stagingVolume.mountPath }}
            {{- if and (eq .Values.storage.backend "nfs") .Values.storage.nfs.persistence.enabled }}
            - name: nfs-data
              mountPath: {{ .Values.storage.nfs.mountPath | default "/shared" }}
            {{- end }}
            {{- include "ocr-local.tlsCaVolumeMount" . | nindent 12 }}
          {{- include "ocr-local.workerEnvFrom" . | nindent 10 }}
          env:
            {{- include "ocr-local.workerSecretEnv" . | nindent 12 }}
          startupProbe:
            exec:
              command:
                - python
                - -c
                - "import celery"
            failureThreshold: 10
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
                - python3
                - /app/coordinator/worker_healthcheck.py
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - python3
                - /app/coordinator/worker_healthcheck.py
            periodSeconds: 60
            timeoutSeconds: 15
          resources:
            {{- toYaml .Values.cpuWorker.resources | nindent 12 }}
          {{- with .Values.cpuWorker.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
