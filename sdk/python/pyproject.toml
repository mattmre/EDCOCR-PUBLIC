# Python 3.9 remains the advertised baseline. hatchling 1.28+ requires
# Python >=3.10, so the 1.32 floor applies only on 3.10+.
[build-system]
requires = [
    "hatchling>=1.27.0,<1.28; python_version < '3.10'",
    "hatchling>=1.32.0,<2; python_version >= '3.10'",
]
build-backend = "hatchling.build"

[project]
name = "edcocr-sdk"
version = "4.2.0-rc.1"
description = "Python SDK for EDCOCR forensic-grade OCR pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "EDCOCR Contributors" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["ocr", "pdf", "document-processing", "forensic", "paddleocr"]
dependencies = [
    "httpx>=0.24.0",
    # pydantic 2.14.0 requires Python >=3.10; 2.13.5 is the last 3.9 release.
    "pydantic>=2.13.5,<2.14; python_version < '3.10'",
    "pydantic>=2.14.0; python_version >= '3.10'",
]

[project.scripts]
edcocr = "edcocr_sdk.cli:main"
edcocr-mcp = "edcocr_sdk.mcp_server:main"

[project.optional-dependencies]
websockets = ["websockets>=11.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
]

[project.urls]
Homepage = "https://github.com/mattmre/EDCOCR-PUBLIC"
Documentation = "https://github.com/mattmre/EDCOCR-PUBLIC/tree/main/sdk/python"
Repository = "https://github.com/mattmre/EDCOCR-PUBLIC"
Issues = "https://github.com/mattmre/EDCOCR-PUBLIC/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/edcocr_sdk"]
