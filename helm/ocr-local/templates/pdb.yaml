{{- end }}
---
# =============================================================================
# PodDisruptionBudget: RabbitMQ
# =============================================================================
{{- if .Values.rabbitmq.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-rabbitmq-pdb
  labels:
    {{- include "ocr-local.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
