{{- $staged := .Values.ocrStagedPage.enabled }}
{{- $inference := .Values.gpuWorker.stagedInference }}
{{- if $staged }}
  {{- if or (eq (lower (toString (index .Values.coordinator.env "OCR_PER_GPU_STRICT" | default "false"))) "true") (eq (lower (toString (index .Values.coordinator.env "ENABLE_PER_GPU_QUEUES" | default "false"))) "true") (eq (lower (toString (index .Values.gpuWorker.env "ENABLE_PER_GPU_QUEUES" | default "false"))) "true") }}
    {{- fail "staged GPU worker consumes shared ocr_gpu only; strict indexed per-GPU queues require an explicitly matched consumer topology" }}
  {{- end }}
  {{- if eq $inference.pool "prefork" }}
    {{- if or (ne (int $inference.concurrency) 1) (ne (int $inference.slotsPerDevice) 1) (ne (int $inference.replicasPerKey) 1) }}
      {{- fail "staged prefork GPU profile requires one process, one device slot and one model replica" }}
    {{- end }}
  {{- else if eq $inference.pool "threads" }}
    {{- if or (lt (int $inference.concurrency) 2) (gt (int $inference.concurrency) 4) (ne (int $inference.slotsPerDevice) (int $inference.concurrency)) (ne (int $inference.replicasPerKey) (int $inference.concurrency)) }}
      {{- fail "staged threaded GPU profile requires 2-4 threads with matching device slots and model replicas" }}
    {{- end }}
    {{- if or (le (int $inference.deviceMemoryMiB) 0) (le (int $inference.modelReplicaMiB) 0) (le (int $inference.runtimeReserveMiB) 0) (gt (add (mul (int $inference.concurrency) (int $inference.modelReplicaMiB)) (int $inference.runtimeReserveMiB)) (int $inference.deviceMemoryMiB)) }}
      {{- fail "staged threaded GPU profile requires an explicit positive model-copy and runtime memory budget within device memory" }}
    {{- end }}
  {{- else }}
    {{- fail "staged GPU inference pool must be prefork or threads" }}
  {{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gpu-worker
  labels:
    {{- include "ocr-local.labels" . | nindent 4 }}
    app.kubernetes.io/component: gpu-worker
spec:
  {{- if not .Values.gpuWorker.autoscaling.enabled }}
  replicas: {{ .Values.gpuWorker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ocr-local.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gpu-worker
  template:
    metadata:
      labels:
        {{- include "ocr-local.labels" . | nindent 8 }}
        app.kubernetes.io/component: gpu-worker
      {{- if .Values.workerSecurity.mTLS.enabled }}
      annotations:
        {{ .Values.workerSecurity.mTLS.annotation }}: {{ .Values.workerSecurity.mTLS.annotationValue | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ocr-local.serviceAccountName" . }}
      {{- include "ocr-local.imagePullSecrets" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.workerTerminationGracePeriodSeconds | default 360 }}
      {{- include "ocr-local.haScheduling" (dict "root" . "component" "gpu-worker") | nindent 6 }}
      {{- with .Values.gpuWorker.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gpuWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gpuWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.gpuWorker.shmSize }}
        - name: staging-volume
          {{- if eq .Values.workerSecurity.stagingVolume.type "emptyDir" }}
          emptyDir:
            medium: {{ .Values.workerSecurity.stagingVolume.emptyDir.medium }}
            sizeLimit: {{ .Values.workerSecurity.stagingVolume.emptyDir.sizeLimit }}
          {{- else }}
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: [ "ReadWriteOnce" ]
                storageClassName: {{ .Values.workerSecurity.stagingVolume.pvc.storageClass | quote }}
                resources:
                  requests:
                    storage: {{ .Values.workerSecurity.stagingVolume.pvc.size }}
          {{- end }}
        {{- if and (eq .Values.storage.backend "nfs") .Values.storage.nfs.persistence.enabled }}
        - name: nfs-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-nfs-data
        {{- end }}
        {{- include "ocr-local.tlsCaVolume" . | nindent 8 }}
      initContainers:
        {{- include "ocr-local.schemaReadinessInit" (dict "root" . "envKind" "worker" "securityContext" .Values.gpuWorker.containerSecurityContext) | nindent 8 }}
      containers:
        - name: gpu-worker
          image: {{ include "ocr-local.workerImage" . }}
          imagePullPolicy: {{ .Values.image.worker.pullPolicy | default "IfNotPresent" }}
          # Preserve Dockerfile.worker.gpu's CUDA/tensor-verifying ENTRYPOINT;
          # args replaces only the image CMD.
          args:
            - celery
            - -A
            - coordinator.coordinator
            - worker
            - --loglevel=info
            - --queues={{ ternary "ocr_gpu" .Values.gpuWorker.queues .Values.ocrStagedPage.enabled }}
            {{- if $staged }}
            - --pool={{ $inference.pool }}
            {{- end }}
            - --concurrency={{ ternary $inference.concurrency .Values.gpuWorker.concurrency $staged }}
            {{- if or (not $staged) (eq $inference.pool "prefork") }}
            - --max-tasks-per-child={{ .Values.gpuWorker.maxTasksPerChild }}
            {{- end }}
            - --hostname=gpu-worker@%h
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: staging-volume
              mountPath: {{ .Values.workerSecurity.stagingVolume.mountPath }}
            {{- if and (eq .Values.storage.backend "nfs") .Values.storage.nfs.persistence.enabled }}
            - name: nfs-data
              mountPath: {{ .Values.storage.nfs.mountPath | default "/shared" }}
            {{- end }}
            {{- include "ocr-local.tlsCaVolumeMount" . | nindent 12 }}
          {{- include "ocr-local.workerEnvFrom" . | nindent 10 }}
          env:
            {{- include "ocr-local.workerSecretEnv" . | nindent 12 }}
            - name: WORKER_QUEUES
              value: {{ ternary "ocr_gpu" .Values.gpuWorker.queues .Values.ocrStagedPage.enabled | quote }}
            - name: WORKER_CONCURRENCY
              value: {{ ternary $inference.concurrency .Values.gpuWorker.concurrency $staged | quote }}
            - name: FASTTEXT_MODEL_PATH
              value: /app/models/lid.176.bin
            {{- range $key, $val := .Values.gpuWorker.env }}
            {{- if not (and $staged (has $key (list "OCR_INFERENCE_SLOTS_PER_DEVICE" "OCR_ENGINE_REPLICAS_PER_KEY" "OCR_WORKER_CAPABILITY" "OCR_SEPARATE_TESSERACT_LANE"))) }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- end }}
            {{- if $staged }}
            - name: OCR_INFERENCE_SLOTS_PER_DEVICE
              value: {{ $inference.slotsPerDevice | quote }}
            - name: OCR_ENGINE_REPLICAS_PER_KEY
              value: {{ $inference.replicasPerKey | quote }}
            - name: OCR_WORKER_CAPABILITY
              value: "paddle"
            - name: OCR_SEPARATE_TESSERACT_LANE
              value: "true"
            {{- end }}
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - 'python -c "import paddle" && test -d {{ .Values.gpuWorker.startupProbe.modelDir | default "/app/models" }} && test "$(ls -A {{ .Values.gpuWorker.startupProbe.modelDir | default "/app/models" }})"'
            failureThreshold: {{ .Values.gpuWorker.startupProbe.failureThreshold | default 30 }}
            periodSeconds: {{ .Values.gpuWorker.startupProbe.periodSeconds | default 10 }}
          readinessProbe:
            exec:
              command:
                - python3
                - /app/coordinator/worker_healthcheck.py
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - python3
                - /app/coordinator/worker_healthcheck.py
            periodSeconds: 60
          resources:
            {{- toYaml .Values.gpuWorker.resources | nindent 12 }}
          {{- with .Values.gpuWorker.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
