      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./coordinator/Dockerfile.worker.ocr
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SKIP_MODEL_PRELOAD=0
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_TREE_SHA256=${{ steps.source.outputs.sha256 }}
          # Published platform scope; other architectures require separate qualification.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-worker-nlp-image:
    runs-on: ubuntu-latest
