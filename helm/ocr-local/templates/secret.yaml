{{/*
Secret holding all sensitive values. Every key MUST be overridden at install
time via --set or a values-secret.yaml file. The defaults below are
placeholders that will NOT work in production.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    {{- include "ocr-local.labels" . | nindent 4 }}
type: Opaque
data:
  # ---- Django ----
  DJANGO_SECRET_KEY: {{ required "secrets.djangoSecretKey must be set" .Values.secrets.djangoSecretKey | b64enc | quote }}
  {{- $coordinatorApiKey := default .Values.secrets.apiKey .Values.secrets.coordinatorApiKey }}
  OCR_COORDINATOR_API_KEY: {{ required "secrets.coordinatorApiKey (or secrets.apiKey) must be set" $coordinatorApiKey | b64enc | quote }}

  # ---- FastAPI ----
  {{- if .Values.api.enabled }}
  OCR_API_KEY: {{ required "secrets.apiKey must be set when api.enabled=true" .Values.secrets.apiKey | b64enc | quote }}
  {{- end }}

  # ---- PostgreSQL ----
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword must be set" .Values.secrets.postgresPassword | b64enc | quote }}
  {{- $pgPassword := required "secrets.postgresPassword must be set" .Values.secrets.postgresPassword }}
  {{- $pgHost := printf "%s-postgres" .Release.Name }}
  DATABASE_URL: {{ default (printf "postgres://ocr:%s@%s:5432/ocr_coordinator" ($pgPassword | urlquery) $pgHost) .Values.secrets.databaseUrl | b64enc | quote }} # pragma: allowlist secret

  # ---- RabbitMQ ----
  RABBITMQ_USER: {{ default "ocr" .Values.secrets.rabbitmqUser | b64enc | quote }}
  RABBITMQ_PASSWORD: {{ required "secrets.rabbitmqPassword must be set" .Values.secrets.rabbitmqPassword | b64enc | quote }}
  {{- $rmqUser := default "ocr" .Values.secrets.rabbitmqUser }}
  {{- $rmqPassword := required "secrets.rabbitmqPassword must be set" .Values.secrets.rabbitmqPassword }}
  {{- $rmqManagementUser := default $rmqUser .Values.secrets.rabbitmqManagementUser }}
  {{- $rmqManagementPassword := default $rmqPassword .Values.secrets.rabbitmqManagementPassword }}
  {{- if and .Values.secrets.rabbitmqManagementUser (not .Values.secrets.rabbitmqManagementPassword) }}
  {{- fail "secrets.rabbitmqManagementPassword is required when rabbitmqManagementUser is set" }}
  {{- end }}
  {{- if and .Values.secrets.rabbitmqManagementUser (eq $rmqManagementUser $rmqUser) }}
  {{- fail "secrets.rabbitmqManagementUser must differ from secrets.rabbitmqUser" }}
  {{- end }}
  {{- $clusterDomain := trimSuffix "." (.Values.clusterDomain | default "cluster.local") }}
  {{- $rmqHost := printf "%s-rabbitmq.%s.svc.%s" .Release.Name .Release.Namespace $clusterDomain }}
  {{- $rmqManagementScheme := ternary "https" "http" .Values.tls.enabled }}
  {{- $rmqManagementPort := ternary "15671" "15672" .Values.tls.enabled }}
  {{- $rmqManagementHost := default (printf "%s://%s:%s/" $rmqManagementScheme $rmqHost $rmqManagementPort) .Values.keda.rabbitmqManagementHost }}
  {{- $managementUsesInternalCA := and .Values.tls.enabled (not .Values.keda.rabbitmqManagementHost) }}
  {{- $managementUsesConfiguredCA := .Values.keda.rabbitmqManagementCaSecretName }}
  {{- $managementTLS := and (hasPrefix "https://" $rmqManagementHost) (or $managementUsesInternalCA $managementUsesConfiguredCA) }}
  {{- /* Generated URLs follow the bundled listener. clientTls does not create one. */}}
  {{- $brokerTls := .Values.tls.enabled }}
  {{- $defaultBrokerScheme := ternary "amqps" "amqp" $brokerTls }}
  {{- $defaultBrokerPort := ternary "5671" "5672" $brokerTls }}
  CELERY_BROKER_URL: {{ default (printf "%s://%s:%s@%s:%s//" $defaultBrokerScheme ($rmqUser | urlquery) ($rmqPassword | urlquery) $rmqHost $defaultBrokerPort) .Values.secrets.celeryBrokerUrl | b64enc | quote }} # pragma: allowlist secret
  RABBITMQ_MANAGEMENT_HOST: {{ $rmqManagementHost | b64enc | quote }}
  RABBITMQ_MANAGEMENT_USER: {{ $rmqManagementUser | b64enc | quote }}
  RABBITMQ_MANAGEMENT_PASSWORD: {{ $rmqManagementPassword | b64enc | quote }}
  {{- if $managementTLS }}
  RABBITMQ_MANAGEMENT_TLS: {{ "enable" | b64enc | quote }}
  {{- end }}
  CELERY_TASK_SIGNING_KEY: {{ required "secrets.celeryTaskSigningKey must be set" .Values.secrets.celeryTaskSigningKey | b64enc | quote }}

  # ---- Redis ----
  REDIS_PASSWORD: {{ required "secrets.redisPassword must be set" .Values.secrets.redisPassword | b64enc | quote }}
  {{- $redisPassword := required "secrets.redisPassword must be set" .Values.secrets.redisPassword }}
  {{- $redisHost := printf "%s-redis" .Release.Name }}
  {{- /* Same listener rule as the broker: clientTls must not invent port 6380. */}}
  {{- $redisTls := .Values.tls.enabled }}
  {{- $defaultRedisScheme := ternary "rediss" "redis" $redisTls }}
  {{- $defaultRedisPort := ternary "6380" "6379" $redisTls }}
  REDIS_URL: {{ default (printf "%s://:%s@%s:%s/0" $defaultRedisScheme ($redisPassword | urlquery) $redisHost $defaultRedisPort) .Values.secrets.redisUrl | b64enc | quote }} # pragma: allowlist secret
  {{- $defaultResultBackend := printf "%s://:%s@%s:%s/1" $defaultRedisScheme ($redisPassword | urlquery) $redisHost $defaultRedisPort -}}
  {{- if .Values.redis.sentinel.enabled -}}
  {{- $defaultResultBackend = include "ocr-local.redisSentinelResultBackend" (dict "root" . "password" $redisPassword "db" 1) -}}
  {{- end }}
  CELERY_RESULT_BACKEND: {{ default $defaultResultBackend .Values.secrets.celeryResultBackend | b64enc | quote }} # pragma: allowlist secret

  # ---- RabbitMQ Erlang Cookie ----
  # The Erlang cookie MUST remain stable across helm upgrades.  If it changes,
  # RabbitMQ nodes cannot re-join the cluster and quorum queues lose quorum.
  # Priority: explicit value > existing secret > auto-generated random value.
  {{ if .Values.rabbitmq.erlangCookieSecret }}
  RABBITMQ_ERLANG_COOKIE: {{ .Values.rabbitmq.erlangCookieSecret | b64enc | quote }}
  {{- else }}
  {{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-secret" .Release.Name)) -}}
  {{- $erlangCookie := "" -}}
  {{- if and $existingSecret $existingSecret.data (index $existingSecret.data "RABBITMQ_ERLANG_COOKIE") -}}
  {{- $erlangCookie = index $existingSecret.data "RABBITMQ_ERLANG_COOKIE" | b64dec -}}
  {{- else -}}
  {{- $erlangCookie = randAlphaNum 64 -}}
  {{- end }}
  RABBITMQ_ERLANG_COOKIE: {{ $erlangCookie | b64enc | quote }}
  {{ end }}

  # ---- Flower ----
  {{- if .Values.flower.enabled }}
  FLOWER_PASSWORD: {{ required "secrets.flowerPassword must be set when flower.enabled=true" .Values.secrets.flowerPassword | b64enc | quote }}
  {{- end }}

  # ---- Metrics API ----
  {{- if .Values.secrets.metricsApiKey }}
  METRICS_API_KEY: {{ .Values.secrets.metricsApiKey | b64enc | quote }}
  {{- end }}

  WEBHOOK_SECRET_KEY: {{ required "secrets.webhookSecretKey must be set" .Values.secrets.webhookSecretKey | b64enc | quote }}
  PII_ENCRYPTION_KEY: {{ required "secrets.piiEncryptionKey must be set" .Values.secrets.piiEncryptionKey | b64enc | quote }}

  # ---- S3 (only when storage.backend == "s3") ----
  {{- if eq .Values.storage.backend "s3" }}
  {{- if eq .Values.storage.s3.authMode "static" }}
  S3_ENDPOINT: {{ required "secrets.s3Endpoint is required for static S3 authentication" .Values.secrets.s3Endpoint | b64enc | quote }}
  {{- else }}
  S3_ENDPOINT: {{ default "" .Values.secrets.s3Endpoint | b64enc | quote }}
  {{- end }}
  S3_BUCKET: {{ required "secrets.s3Bucket is required when storage.backend=s3" .Values.secrets.s3Bucket | b64enc | quote }}
  {{- if eq .Values.storage.s3.authMode "static" }}
  S3_ACCESS_KEY: {{ required "secrets.s3AccessKey is required when storage.backend=s3" .Values.secrets.s3AccessKey | b64enc | quote }}
  S3_SECRET_KEY: {{ required "secrets.s3SecretKey is required when storage.backend=s3" .Values.secrets.s3SecretKey | b64enc | quote }}
  S3_SESSION_TOKEN: {{ default "" .Values.secrets.s3SessionToken | b64enc | quote }}
  {{- end }}
  S3_REGION: {{ default "" .Values.secrets.s3Region | b64enc | quote }}
  {{- if .Values.storage.s3.usePresignedUrls }}
  S3_PRESIGNED_TASK_KEY: {{ required "secrets.presignedTaskKey is required when storage.s3.usePresignedUrls=true" .Values.secrets.presignedTaskKey | b64enc | quote }}
  {{- end }}
  {{- end }}
