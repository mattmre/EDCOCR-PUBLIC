x-coordinator-build-args: &coordinator-build-args
  # These labels are part of the source-bound coordinator image identity.
  # See docs/setup/AIRGAP-STANDUP.md and docs/setup/FARM-STANDUP.md.
  SOURCE_REVISION: "${SOURCE_REVISION:-unknown}"
  SOURCE_TREE_SHA256: "${SOURCE_TREE_SHA256:-unknown}"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ocr_coordinator
      POSTGRES_USER: ocr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocr -d ocr_coordinator"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    memswap_limit: ${POSTGRES_MEMSWAP_LIMIT:-768m}

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      # Never default to guest (R2-A16 residual). Bootstrap admin user only;
      # least-privilege ocr_publisher / ocr_worker via scripts/setup_rabbitmq_acls.py.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ocr_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      # ACL template for operators/docs; runtime principals via
      # scripts/setup_rabbitmq_acls.py (not silent load_definitions — passwords
      # must be operator-supplied, not empty hash stubs).
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.template.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: ${RABBITMQ_MEM_LIMIT:-512m}
    memswap_limit: ${RABBITMQ_MEMSWAP_LIMIT:-768m}

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env} --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-192mb} --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli -e ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    memswap_limit: ${REDIS_MEMSWAP_LIMIT:-384m}

  django:
    build:
      context: ..
      dockerfile: coordinator/Dockerfile.coordinator
      args: *coordinator-build-args
    command: >
      sh -c "set -eu;
             python manage.py migrate --noinput;
             python manage.py collectstatic --noinput;
             exec gunicorn coordinator.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"
    environment: &coordinator_env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-development}
      PRODUCTION_READINESS_ACK: ${PRODUCTION_READINESS_ACK:-false}
      DATABASE_URL: postgres://ocr:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/ocr_coordinator
      # After scripts/setup_rabbitmq_acls.py, set CELERY_BROKER_URL to the
      # ocr_publisher principal (R2-RC-01). Default uses bootstrap admin user.
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://${RABBITMQ_USER:-ocr_user}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672//}
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_TASK_SIGNING_KEY: ${CELERY_TASK_SIGNING_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY:-}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
      S3_PRESIGNED_TASK_KEY: ${S3_PRESIGNED_TASK_KEY:-}
      EDC_TRANSLATION_PREFER_EXTERNAL: ${EDC_TRANSLATION_PREFER_EXTERNAL:-false}
      EDC_TRANSLATION_URL: ${EDC_TRANSLATION_URL:-http://edc-translation:8080}
      EDC_TRANSLATION_PROVIDER_ID: ${EDC_TRANSLATION_PROVIDER_ID:-passthrough}
      EDC_TRANSLATION_TIMEOUT_SECONDS: ${EDC_TRANSLATION_TIMEOUT_SECONDS:-30}
      EDC_TRANSLATION_READINESS_PATH: ${EDC_TRANSLATION_READINESS_PATH:-/health}
      NFS_ROOT: ${NFS_ROOT:-/shared}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-nfs}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_SESSION_TOKEN: ${S3_SESSION_TOKEN:-}
      S3_AUTH_MODE: ${S3_AUTH_MODE:-static}
      S3_REGION: ${S3_REGION:-us-east-1}
      METRICS_API_KEY: ${METRICS_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ${NFS_HOST_PATH:-./shared}:/shared
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: ${DJANGO_MEM_LIMIT:-1024m}
    memswap_limit: ${DJANGO_MEMSWAP_LIMIT:-1536m}

  celery-coordinator:
    build:
      context: ..
      dockerfile: coordinator/Dockerfile.coordinator
      args: *coordinator-build-args
    command: celery -A coordinator worker -Q coordinator,translation_batch -c 2 -l info --hostname coordinator@%h
    environment: *coordinator_env
    volumes:
      - ${NFS_HOST_PATH:-./shared}:/shared
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: ${CELERY_COORDINATOR_MEM_LIMIT:-1024m}
    memswap_limit: ${CELERY_COORDINATOR_MEMSWAP_LIMIT:-1536m}

  celery-beat:
    build:
      context: ..
      dockerfile: coordinator/Dockerfile.coordinator
      args: *coordinator-build-args
    command: celery -A coordinator beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment: *coordinator_env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: ${CELERY_BEAT_MEM_LIMIT:-512m}
    memswap_limit: ${CELERY_BEAT_MEMSWAP_LIMIT:-768m}

  flower:
    build:
      context: ..
      dockerfile: coordinator/Dockerfile.coordinator
      args: *coordinator-build-args
    command: celery -A coordinator flower --port=5555 --basic-auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?Set FLOWER_PASSWORD in .env} --broker_api=http://${RABBITMQ_USER:-ocr_user}:${RABBITMQ_PASSWORD}@rabbitmq:15672/api/
    environment: *coordinator_env
    # Loopback by default — compose merges ports by concatenation, so a bare
    # 5555:5555 here would stay published on 0.0.0.0 even after lan.yml adds
    # 127.0.0.1:5555. Operators may rebind via FLOWER_LAN_BIND in lan.yml.
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      rabbitmq:
        condition: service_healthy
    mem_limit: ${FLOWER_MEM_LIMIT:-512m}
    memswap_limit: ${FLOWER_MEMSWAP_LIMIT:-768m}

  edc-translation:
    profiles:
      - edc-translation
    build:
      context: ${EDC_TRANSLATION_REPO:-../../EDC_TRANSLATION}
      dockerfile: Dockerfile
    image: ${EDC_TRANSLATION_IMAGE:-edc-translation:0.1.0}
    ports:
      - "127.0.0.1:${EDC_TRANSLATION_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: ${EDC_TRANSLATION_MEM_LIMIT:-512m}
    memswap_limit: ${EDC_TRANSLATION_MEMSWAP_LIMIT:-1024m}

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
