# =============================================================================
# OCR-Local Helm Chart — values.yaml
# Industrial Adaptive OCR — Forensic Grade Document Processing
# =============================================================================

# Production values opt into fail-closed topology checks for incomplete
# high-availability modes such as bundled Redis Sentinel.
productionMode: false

# ---------------------------------------------------------------------------
# Graceful shutdown — must exceed SHUTDOWN_DRAIN_TIMEOUT_SECONDS (default 300)
# ---------------------------------------------------------------------------
workerTerminationGracePeriodSeconds: 360   # 300s drain + 60s buffer
coordinatorTerminationGracePeriodSeconds: 60

# Kubernetes DNS suffix used by broker clients outside the release namespace
# (notably KEDA's operator namespace).
clusterDomain: cluster.local

haScheduling:
  enabled: true
  hostnameWhenUnsatisfiable: ScheduleAnyway
  zoneWhenUnsatisfiable: ScheduleAnyway

# ---------------------------------------------------------------------------
# RBAC — ServiceAccount for pod identity separation
# ---------------------------------------------------------------------------
rbac:
  create: true

# ---------------------------------------------------------------------------
# Container images
# ---------------------------------------------------------------------------
image:
  # Set true in production overlays to fail closed unless every rendered
  # application/infrastructure image is pinned by digest.
  requireDigest: false
  coordinator:
    repository: ocr-local/coordinator
    tag: ""          # defaults to Chart.appVersion
    digest: ""       # sha256:<64 hex chars>; preferred for releases
    pullPolicy: IfNotPresent
  worker:
    repository: ocr-local/worker
    tag: ""          # defaults to Chart.appVersion
    digest: ""
    pullPolicy: IfNotPresent
  cpuOcrWorker:
    repository: ocr-local/worker-cpu
    tag: ""          # defaults to Chart.appVersion
    digest: ""
    pullPolicy: IfNotPresent
  tesseractWorker:
    repository: ocr-local/worker-tesseract
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  nlpWorker:
    repository: ocr-local/worker-nlp
    tag: ""          # defaults to Chart.appVersion
    digest: ""
    pullPolicy: IfNotPresent
  layoutlmWorker:
    repository: ocr-local/worker-layoutlm
    tag: ""          # defaults to Chart.appVersion
    digest: ""
    pullPolicy: IfNotPresent
  frontend:
    repository: ocr-local/frontend
    tag: ""          # defaults to Chart.appVersion
    digest: ""
    pullPolicy: IfNotPresent
  # FastAPI surface used by the operator console.  This is a separate image
  # from the Django coordinator; routing /api to the coordinator is invalid.
  api:
    repository: ocr-local/api
    tag: ""          # defaults to Chart.appVersion
    digest: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []

# ---------------------------------------------------------------------------
# Worker Security (mTLS & Encrypted Staging for PII)
# ---------------------------------------------------------------------------
workerSecurity:
  # Configure a Service Mesh annotation for mTLS on the worker pods
  # (Since workers process plaintext PII, mTLS is mandated)
  mTLS:
    enabled: true
    annotation: "sidecar.istio.io/inject"
    annotationValue: "true"

  # S2-02 / R2 residual / S1-05: do NOT envFrom the full release Secret into
  # workers, coordinator, celery-beat, or celery-coordinator.
  # When true (default), those pods get configMap + explicit secretKeyRef for
  # broker/DB/Redis/Django (plus metrics/S3 for coordinator path); S3 on
  # workers only when storage.backend=s3 and storage.workerInjectS3Credentials.
  # Flower already uses a selective pattern. Set false only for legacy full
  # secretRef envFrom.
  leastSecretEnv: true

  # Configure encrypted volumes for the worker temp staging
  # Mandates encrypted storage classes or in-memory emptyDir for staging.
  stagingVolume:
    # "emptyDir" (medium: Memory) or "pvc" (must use encrypted storageClass)
    type: "emptyDir" 
    emptyDir:
      medium: Memory
      sizeLimit: "2Gi"
    pvc:
      storageClass: "encrypted-sc" # Ensure this storage class encrypts data at rest
      size: "10Gi"
    mountPath: "/tmp/staging"

# ---------------------------------------------------------------------------
# Coordinator (Django + Gunicorn)
# ---------------------------------------------------------------------------
coordinator:
  replicas: 2
  healthTenantId: "health"
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  gunicorn:
    workers: 4
    timeout: 120
  env:
    DJANGO_DEBUG: "False"
    # Operators MUST set this to actual hostname(s); empty string rejects all requests by default.
    DJANGO_ALLOWED_HOSTS: ""
    DEPLOYMENT_ENV: production
    PRODUCTION_READINESS_ACK: "true"
    ENABLE_TRANSLATION: "false"
    ENABLE_TRANSLATION_API: "false"
    ENABLE_HANDWRITING_MT: "false"
    OCR_TRANSLATION_ENFORCE_PROVENANCE: "true"
    DATABASE_SCHEMA: "public"
    OCR_TASK_ROUTING: "gpu"
    OCR_FAIR_FANOUT_ENABLED: "false"
    OCR_MAX_INFLIGHT_PAGES_PER_DOCUMENT: "8"
    ALLOW_DEGRADED_NER: "false"

# Feature-flagged page-level handoff between mutually exclusive OCR images.
# Deploy both worker classes first, then enable this flag on coordinators.
ocrCapabilitySeparation:
  enabled: false

# Durable CPU render -> GPU inference -> CPU finalization. Default off until
# target hardware and all storage modes are qualified with current source.
ocrStagedPage:
  enabled: false
  # Fleet-wide decoded raster reservation; worker memory also holds encoded
  # payloads, PIL copies, detector crops and native predictor allocations.
  # Keep per-pod memory limits above that active overhead after measuring it.
  globalBytes: "17179869184"
  maxPageBytes: "268435456"
  maxCapacityWaitSeconds: "3600"
  leaseSeconds: "1800"
  recoveryIntervalSeconds: "60"
  # A single legal document can feed 16/32 logical workers without the old
  # eight-page fair-admission bottleneck; DB byte reservations still govern.
  maxInflightPagesPerDocument: "64"
  render:
    replicas: 4
    concurrency: 2
    autoscaling: {enabled: false, minReplicas: 4, maxReplicas: 16, queueTarget: 4}
    resources:
      requests: {cpu: "2", memory: 4Gi}
      limits: {cpu: "4", memory: 8Gi}
  finalize:
    replicas: 4
    concurrency: 2
    autoscaling: {enabled: false, minReplicas: 4, maxReplicas: 16, queueTarget: 4}
    resources:
      requests: {cpu: "2", memory: 4Gi}
      limits: {cpu: "4", memory: 8Gi}

# ---------------------------------------------------------------------------
# External EDC_TRANSLATION seam (default OFF)
# ---------------------------------------------------------------------------
edcTranslation:
  preferExternal: "false"
  url: ""
  providerId: "passthrough"
  timeoutSeconds: "30"
  readinessPath: "/health"

# External strong-auth proof verifier used by review certification. The route
# remains fail-closed (HTTP 501) while verifierUrl is empty.
reviewStrongAuth:
  verifierUrl: ""
  caSecretName: ""
  caSecretKey: "ca.crt"

# ---------------------------------------------------------------------------
# Frontend operator console (Next.js)
# ---------------------------------------------------------------------------
frontend:
  enabled: true
  replicas: 1
  maxConcurrentJobs: 4
  apiBaseUrl: "/"                 # same-origin ingress/service path by default
  httpOnlySession: false          # runtime browser cookie mode; requires API sessions
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ---------------------------------------------------------------------------
# FastAPI API surface
# ---------------------------------------------------------------------------
# The API uses a single SQLite writer by default, so keep replicas at one
# unless the operator supplies a separately coordinated database backend.
api:
  enabled: true
  replicas: 1
  # Inference concurrency is memory-bound. Queue capacity may be larger so
  # callers can submit bounded work without forcing pipelines to overlap.
  maxConcurrentJobs: 1
  maxQueuedJobs: 4
  # Qualified local API profile: one full document pipeline at a time. Add
  # fleet capacity through coordinator workers for larger parallelism.
  pipeline:
    workers: 2
    extractors: 2
    compressors: 1
    ompThreads: 1
    mklThreads: 1
    nativeThreadsPerPredictor: 1
    modelReplicasPerKey: 2
    inferenceSlotsPerDevice: 2
    # Planning reservation per concurrent full pipeline, based on the
    # qualified 8 GiB local API recipe. This is not a measured RSS ceiling.
    memoryBudgetMiB: 8192
  dataMountPath: /app/ocr_data
  sourceSubdir: source
  outputSubdir: output
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 8Gi
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# ---------------------------------------------------------------------------
# Celery coordinator worker (job lifecycle queue)
# ---------------------------------------------------------------------------
celeryCoordinator:
  replicas: 1
  concurrency: 2
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi

# ---------------------------------------------------------------------------
# Celery Beat (periodic tasks)
# ---------------------------------------------------------------------------
celeryBeat:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ---------------------------------------------------------------------------
# Flower (Celery monitoring dashboard)
#
# SECURITY NOTE (maintenance review):
#   Flower exposes Celery task queue internals (job IDs, file paths, timings,
#   worker hostnames, argument payloads). Basic HTTP auth is the ONLY
#   authentication layer Flower ships with and is NOT sufficient for exposure
#   on untrusted networks.
#
#   In production:
#     1. Do NOT expose Flower through a public Ingress. Keep it ClusterIP-only
#        (the default) and access it through `kubectl port-forward`, a VPN, or
#        an authenticated ingress that enforces SSO/OIDC and IP allow-listing.
#     2. Leave `flower.networkPolicy.enabled=true` so only pods in the release
#        namespace can reach Flower on port 5555.
#     3. Rotate `secrets.flowerPassword` regularly and use a long random value.
#     4. `FLOWER_UNAUTHENTICATED_API=false` is enforced below so the Flower
#        REST API cannot be called without credentials even if the UI is
#        proxied.
# ---------------------------------------------------------------------------
flower:
  # LT-11 / S2-04: default OFF — Flower basic-auth is not SSO. Opt-in only when
  # operators accept basic-auth + namespace NetworkPolicy (see SECURITY NOTE).
  enabled: false
  # NetworkPolicy restricting Flower ingress to pods within the release namespace.
  # Leave enabled in production unless a dedicated, authenticated ingress path
  # is being provisioned. See SECURITY NOTE above.
  networkPolicy:
    enabled: true
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ---------------------------------------------------------------------------
# GPU OCR workers
# ---------------------------------------------------------------------------
gpuWorker:
  replicas: 2
  # Staged inference defaults to one prefork process per one-visible-GPU pod.
  # Threads are an opt-in hardware-qualification profile: one process owns all
  # predictors on that device, and slots/model copies have an explicit budget.
  stagedInference:
    # prefork is the safe default because EngineRuntimePool is process-local.
    # threads runs ONE Celery process on each one-visible-GPU pod; concurrent
    # predictor owners are bounded by slotsPerDevice and replicasPerKey.
    # Qualify real VRAM/native-memory use on target hardware before enabling.
    # Celery soft time limits do not interrupt an occupied thread: rely on
    # hard pod termination, late ACK, durable stage leases and Beat recovery.
    # The budget below is an operator estimate, not a measured hardware claim.
    pool: prefork
    concurrency: 1
    slotsPerDevice: 1
    replicasPerKey: 1
    deviceMemoryMiB: 0
    modelReplicaMiB: 0
    runtimeReserveMiB: 0
  concurrency: 4
  queues: "ocr_gpu,cpu_general,nlp_general"
  env:
    OCR_NATIVE_THREADS_PER_PREDICTOR: "4"
    OCR_RECOGNIZER_BATCH_SIZE: "6"
    OCR_INFERENCE_SLOTS_PER_DEVICE: "1"
    OCR_ENGINE_REPLICAS_PER_KEY: "1"
    # Fleet overlays set OCR_GPU_LOCAL_DEVICE=0 only for one-visible-device pods.
  maxTasksPerChild: 50
  shmSize: 8Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - SYS_PTRACE
    seccompProfile:
      type: RuntimeDefault
  autoscaling:
    enabled: false
    minReplicas: 2              # Plan C Phase 0 tuning -- min replicas for ocr_gpu queue
    maxReplicas: 8              # Plan C Phase 0 tuning -- max replicas for ocr_gpu queue
    pollingInterval: 15         # Plan C Phase 0 tuning -- queue poll interval (seconds)
    cooldownPeriod: 120         # Plan C Phase 0 tuning -- scale-down cooldown (seconds)
    queueTarget: 5
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
      nvidia.com/gpu: 1
    limits:
      cpu: "8"
      memory: 16Gi
      nvidia.com/gpu: 1
  startupProbe:
    modelDir: /app/models       # Directory containing PaddleOCR model files
    failureThreshold: 30        # 30 * 10s = 5 min max startup time
    periodSeconds: 10
  nodeSelector: {}
  tolerations: []

# ---------------------------------------------------------------------------
# CPU OCR workers (native-Paddle CPU inference; the qualified default recipe)
# For deployments without GPU hardware or to supplement GPU workers.
# ONNX Runtime is an explicit opt-in only: it requires installing onnxruntime
# into the worker image and setting OCR_INFERENCE_BACKEND=onnx.
# ---------------------------------------------------------------------------
cpuOcrWorker:
  enabled: false            # Disabled by default; enable for CPU-only deployments
  replicas: 2
  concurrency: 4
  queues: "ocr_cpu"
  maxTasksPerChild: 100     # Higher than GPU (less memory pressure without VRAM)
  env:
    OCR_INFERENCE_BACKEND: "paddle" # Native Paddle CPU inference (qualified default)
    OCR_TASK_ROUTING: "cpu"         # Route OCR tasks to ocr_cpu queue
    OCR_NATIVE_THREADS_PER_PREDICTOR: "4"
    OCR_RECOGNIZER_BATCH_SIZE: "6"
    OCR_INFERENCE_SLOTS_PER_DEVICE: "1"
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  autoscaling:
    enabled: false
    minReplicas: 1              # Plan C Phase 0 tuning -- min replicas for ocr_cpu queue
    maxReplicas: 8              # Plan C Phase 0 tuning -- max replicas for ocr_cpu queue
    pollingInterval: 15         # Plan C Phase 0 tuning -- queue poll interval (seconds)
    cooldownPeriod: 120         # Plan C Phase 0 tuning -- scale-down cooldown (seconds)
    queueTarget: 3          # Lower target (CPU is slower, keep queue shallow)
  resources:
    requests:
      cpu: "4"
      memory: 4Gi
    limits:
      cpu: "8"
      memory: 8Gi
  nodeSelector: {}
  tolerations: []

tesseractWorker:
  enabled: false
  replicas: 1
  concurrency: 2
  queues: "ocr_tesseract"
  maxTasksPerChild: 100
  env:
    OCR_WORKER_CAPABILITY: "tesseract"
    OCR_SEPARATE_TESSERACT_LANE: "true"
    OCR_LANGUAGE_TIERS: "core,extended"
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 8
    pollingInterval: 15
    cooldownPeriod: 120
    queueTarget: 3
  resources:
    requests: {cpu: "2", memory: 2Gi}
    limits: {cpu: "4", memory: 4Gi}
  nodeSelector: {}
  tolerations: []

# ---------------------------------------------------------------------------
# Layout CPU workers (barcode/QR extraction, OMR checkbox detection)
# CPU-bound tasks using pyzbar; no GPU required.
# ---------------------------------------------------------------------------
layoutCpuWorker:
  enabled: false            # Disabled by default; enable when layout extraction is needed
  replicas: 1
  concurrency: 4
  queues: "ocr_layout_cpu"
  maxTasksPerChild: 200     # Lightweight CPU tasks — higher recycling threshold
  capabilities: "barcode,omr,layout"
  env:
    ENABLE_BARCODE_EXTRACTION: "true"
    ENABLE_OMR_DETECTION: "true"
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  autoscaling:
    enabled: false
    minReplicas: 0
    maxReplicas: 10
    pollingInterval: 15
    cooldownPeriod: 120
    queueTarget: 5
  resources:
    requests:
      cpu: "2"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 4Gi
  nodeSelector: {}
  tolerations: []

# ---------------------------------------------------------------------------
# NLP GPU workers (VLM inference gateway, semantic search)
# GPU-bound tasks for vision-language model inference.
# Uses Dockerfile.worker.nlp image with VLM dependencies.
# ---------------------------------------------------------------------------
nlpGpuWorker:
  enabled: false            # Disabled by default; enable when VLM inference is needed
  replicas: 1
  concurrency: 2            # VLM inference is memory-heavy; keep concurrency low
  queues: "ocr_nlp_gpu,nlp_general"
  maxTasksPerChild: 25      # Aggressive recycling to reclaim GPU memory
  shmSize: 8Gi
  capabilities: "vlm,semantic_search"
  env:
    VLM_GATEWAY_ENABLED: "true"
    VLM_PROVIDER: "local"          # "local", "openai", "anthropic"
    VLM_MAX_TOKENS: "4096"
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - SYS_PTRACE
    seccompProfile:
      type: RuntimeDefault
  autoscaling:
    enabled: false
    minReplicas: 2              # Plan C Phase 0 tuning -- min replicas for nlp_general queue
    maxReplicas: 6              # Plan C Phase 0 tuning -- max replicas for nlp_general queue
    pollingInterval: 30         # Plan C Phase 0 tuning -- queue poll interval (seconds)
    cooldownPeriod: 180         # Plan C Phase 0 tuning -- scale-down cooldown (seconds)
    queueTarget: 3           # Keep queue shallow for expensive GPU tasks
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
      nvidia.com/gpu: 1
    limits:
      cpu: "8"
      memory: 32Gi
      nvidia.com/gpu: 1
  nodeSelector: {}
  tolerations: []

# ---------------------------------------------------------------------------
# LayoutLMv3 workers (document understanding, semantic entity extraction)
# GPU-accelerated transformer inference using microsoft/layoutlmv3-base.
# Uses Dockerfile.worker.layoutlm with pre-baked model weights.
# ---------------------------------------------------------------------------
layoutlmWorker:
  enabled: false            # Disabled by default; enable for LayoutLMv3 inference
  replicas: 1
  concurrency: 2            # Transformer inference is memory-heavy; keep concurrency low
  queues: "ocr_layoutlm"
  maxTasksPerChild: 25      # Aggressive recycling to reclaim GPU/CPU memory
  shmSize: 4Gi
  capabilities: "layoutlm,document_understanding"
  env:
    LAYOUTLM_DEVICE: "auto"           # "auto", "cuda", "cpu"
    LAYOUTLM_BATCH_SIZE: "1"
    LAYOUTLM_CONFIDENCE_THRESHOLD: "0.5"
  gpu:
    enabled: true             # Set to false for CPU-only LayoutLMv3 inference
    count: 1
  model:
    name: "microsoft/layoutlmv3-base"
    cacheDir: "/models"
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - SYS_PTRACE
    seccompProfile:
      type: RuntimeDefault
  autoscaling:
    enabled: false
    minReplicas: 0              # Plan C Phase 0 tuning -- min replicas for ocr_layoutlm queue (scale-to-zero)
    maxReplicas: 3              # Plan C Phase 0 tuning -- max replicas for ocr_layoutlm queue
    pollingInterval: 30         # Plan C Phase 0 tuning -- queue poll interval (seconds)
    cooldownPeriod: 300         # Plan C Phase 0 tuning -- scale-down cooldown (seconds)
    queueTarget: 2
  # The nvidia.com/gpu device request is injected into requests+limits by
  # layoutlm-worker-deployment.yaml from gpu.count when gpu.enabled=true.  Do
  # NOT hardcode nvidia.com/gpu here -- that would also request a GPU in
  # CPU-only mode (gpu.enabled=false, LAYOUTLM_DEVICE=cpu).
  resources:
    requests:
      memory: "2Gi"
      cpu: "1"
    limits:
      memory: "4Gi"
  nodeSelector: {}
  tolerations: []

# ---------------------------------------------------------------------------
# CPU-only workers (compression, NER, postprocessing)
# ---------------------------------------------------------------------------
cpuWorker:
  replicas: 1
  concurrency: 8
  queues: "cpu_general,nlp_general"
  nodeSelector: {}
  tolerations: []
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  autoscaling:
    enabled: false
    minReplicas: 2              # Plan C Phase 0 tuning -- min replicas for cpu_general (compression) queue
    maxReplicas: 8              # Plan C Phase 0 tuning -- max replicas for cpu_general queue
    pollingInterval: 30         # Plan C Phase 0 tuning -- queue poll interval (seconds)
    cooldownPeriod: 180         # Plan C Phase 0 tuning -- scale-down cooldown (seconds)
    queueTarget: 10
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi

# ---------------------------------------------------------------------------
# Shared storage
# ---------------------------------------------------------------------------
# R2-RC-20: backend "nfs" alone only sets NFS_ROOT in ConfigMap (env theater).
# For real shared volumes set storage.nfs.persistence.enabled=true (creates PVC
# {{ .Release.Name }}-nfs-data) and mountPath on workers. storage.nfs.server is
# for operator CSI/static PV documentation; chart does not auto-create NFS PV.
storage:
  backend: nfs                   # "nfs" or "s3" (nfs requires PVC for real share)
  # S2-02: when workerSecurity.leastSecretEnv=true, S3 credentials are only
  # injected into worker pods if this is true. Prefer presigned I/O (default).
  workerInjectS3Credentials: false
  nfs:
    server: ""                   # NFS server hostname / IP (document for CSI/PV)
    path: /shared                # legacy local root without a PVC; configure the export in the PV/CSI driver
    mountPath: /shared           # container mount when persistence.enabled
    persistence:
      enabled: false             # set true to create RWX PVC (not env-only)
      size: 100Gi
      storageClass: ""
      accessMode: ReadWriteMany
  s3:
    # static: explicit endpoint/key pair; iam: refreshable SDK provider chain.
    authMode: static
    # Existing operator-managed IAM service account, used only by control-plane
    # pods. Required in iam mode; workers retain the credential-free account.
    controlPlaneServiceAccount: ""
    # Exact signed URL hostnames, including bucket-prefixed AWS hosts. Required
    # for IAM presigned mode; no wildcard suffix matching is permitted.
    presignedAllowedHosts: []
    # The cache shares the protected worker staging volume. Keep headroom for
    # raster and output staging, especially when emptyDir.medium is Memory.
    # Cache eviction has one pod-local byte budget; immutable source fetches
    # allow up to four concurrent transfers per worker process, so process
    # concurrency still contributes to transient network/staging pressure.
    cacheDir: /tmp/staging/ocr-cache
    cacheMaxSizeGB: 1
    cacheMaxObjectGB: 0.5
    usePresignedUrls: false
    # Optional CA Secret for private S3-compatible endpoints. The key is
    # mounted read-only and exported through AWS_CA_BUNDLE for botocore.
    caSecretName: ""
    caSecretKey: ca.crt
    caMountPath: /etc/s3-ca/ca.crt
    networkPolicy:
      # Required when storage.backend=s3.  The chart refuses an S3 render
      # without an explicit endpoint CIDR allow-list; do not use 0.0.0.0/0.
      allowedCidrs: []
    # endpoint, bucket, accessKey, secretKey, region set via secret

# ---------------------------------------------------------------------------
# PostgreSQL
# ---------------------------------------------------------------------------
# SECURITY: Infrastructure images should be pinned to specific digests in production.
# Update with: docker pull <image>:<tag> && docker inspect --format='{{.RepoDigests}}' <image>:<tag>
postgresql:
  enabled: true
  # Client transport can be configured independently for an external
  # PostgreSQL service. tls.enabled is the only switch that sets ssl=on on
  # the bundled server. clientTls sets DATABASE_SSLMODE=verify-full and is
  # rejected when the effective database host is a bundled chart alias
  # unless that server is actually serving TLS. Set secrets.databaseUrl to
  # the external host.
  clientTls:
    enabled: false
    caSecretName: ""
    caSecretKey: ca.crt
    caMountPath: /etc/postgresql-ca/ca.crt
  storage: 50Gi
  storageClass: ""
  image:
    repository: postgres
    tag: "16-alpine"
    digest: ""          # required when image.requireDigest=true
  podSecurityContext:
    runAsUser: 999
    fsGroup: 999
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  config:
    maxConnections: 200
    sharedBuffers: 256MB
    effectiveCacheSize: 768MB
    workMem: 4MB
  backup:
    enabled: true               # Plan C Phase 0 tuning -- HA overlay default
    schedule: "0 2 * * *"       # Daily at 2 AM UTC
    retentionCount: 7            # Keep last 7 backups
    storage: 20Gi
    storageClass: ""
    historyLimit: 3
    timeoutSeconds: 3600         # 1 hour max

# ---------------------------------------------------------------------------
# RabbitMQ
# ---------------------------------------------------------------------------
rabbitmq:
  enabled: true
  # Independent client TLS is for an external TLS broker with an explicit
  # amqps secrets.celeryBrokerUrl. The bundled broker requires
  # tls.enabled=true to configure its matching listener and certificates.
  # amqps URLs for this release's RabbitMQ Service, including namespace,
  # cluster, and pod DNS aliases, are not external. A plaintext amqp
  # override of the bundled broker remains valid when tls.enabled=false.
  clientTls:
    enabled: false
    caSecretName: ""
    caSecretKey: ca.crt
    caMountPath: /etc/rabbitmq-ca/ca.crt
  replicas: 1
  storage: 10Gi
  storageClass: ""
  image:
    repository: rabbitmq
    tag: "3.13-management-alpine"
    digest: ""          # required when image.requireDigest=true
  quorumQueues: true            # Plan C Phase 0 tuning -- HA queue replication
  erlangCookieSecret: ""
  podSecurityContext:
    runAsUser: 999
    fsGroup: 999
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  memoryHighWatermark: 0.6

# ---------------------------------------------------------------------------
# Redis
# ---------------------------------------------------------------------------
redis:
  enabled: true
  # Independent client TLS does not open port 6380. It requires both
  # secrets.redisUrl (rediss) and secrets.celeryResultBackend (rediss, or
  # an external sentinel:// URL) to name hosts outside this chart's Redis,
  # replica, and Sentinel Services. A partial override is rejected because
  # the generated endpoint would not match a listener. Bundled Sentinel is
  # plaintext, monitors port 6379, and cannot be combined with tls.enabled.
  clientTls:
    enabled: false
    caSecretName: ""
    caSecretKey: ca.crt
    caMountPath: /etc/redis-ca/ca.crt
  storage: 5Gi
  storageClass: ""
  image:
    repository: redis
    tag: "7-alpine"
    digest: ""          # required when image.requireDigest=true
  podSecurityContext:
    runAsUser: 999
    fsGroup: 999
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  maxmemory: "256mb"
  maxmemoryPolicy: allkeys-lru
  sentinel:
    # Sentinel manifests are opt-in lab scaffolding only.  The chart's
    # application clients use direct redis:// URLs unless an external,
    # Sentinel-aware client overlay is supplied; keep this false by default.
    # Bundled Sentinel has no TLS listener and always monitors plaintext
    # port 6379, so it cannot be combined with tls.enabled.
    enabled: false
    masterName: ocr-master
    replicas: 1                  # Number of read replicas
    sentinelReplicas: 3          # Number of sentinel instances (odd number)
    quorum: 2                    # Majority of sentinelReplicas needed for failover
    downAfterMs: 5000
    failoverTimeoutMs: 10000

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  host: ocr.example.com
  tls: true
  clusterIssuer: letsencrypt-prod
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

# Distinct authenticated Django coordinator submission endpoint. This does
# not replace the standalone FastAPI/UI ingress or its broader API contract.
fleetIngress:
  enabled: false
  className: nginx
  host: ""
  tls: true
  tlsSecretName: ""
  clusterIssuer: letsencrypt-prod
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"

# ---------------------------------------------------------------------------
# Network policy
# ---------------------------------------------------------------------------
# PH2-14 / PH3-14: production posture requires NetworkPolicy. Default is
# **true** so a bare `helm install` is not an open CNI free-for-all.
# Local/kind sandboxes without a network-policy-capable CNI must set
# `networkPolicy.enabled=false` (see values-local-sandbox.yaml).
# values-production.yaml also pins enabled=true explicitly.
networkPolicy:
  enabled: true
  # Coordinator/API ingress is limited to same-namespace callers plus the
  # configured ingress-controller namespace. Override the label for clusters
  # that use a different ingress namespace.
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ingress-nginx
  # Explicit selectors for shared dependencies outside this release. When a
  # dependency is enabled here, egress is constrained by both namespace and
  # pod identity instead of the chart's same-namespace component label.
  externalDependencies:
    postgresql:
      enabled: false
      namespaceSelector: {}
      podSelector: {}
      port: 5432
    rabbitmq:
      enabled: false
      namespaceSelector: {}
      podSelector: {}
      port: 5672
    redis:
      enabled: false
      namespaceSelector: {}
      podSelector: {}
      port: 6379
    s3:
      enabled: false
      namespaceSelector: {}
      podSelector: {}
      port: 443

# ---------------------------------------------------------------------------
# Assembly tuning
# ---------------------------------------------------------------------------
assembly:
  streamingThresholdPages: 1000
  checkpointIntervalPages: 250

# ---------------------------------------------------------------------------
# Cleanup
# ---------------------------------------------------------------------------
cleanup:
  retentionDays: 30             # JOB_RETENTION_DAYS — Job metadata
  piiRetentionDays: 90          # PII_ENTITY_RETENTION_DAYS — PII/PHI entity records
  auditLogRetentionDays: 2555   # AUDIT_LOG_RETENTION_DAYS — CustodyEvent records (~7 years)
  outputRetentionDays: 90       # OUTPUT_RETENTION_DAYS — Output files on disk

# ---------------------------------------------------------------------------
# Secrets (MUST be overridden at install time via --set or values-secret.yaml)
# ---------------------------------------------------------------------------
secrets:
  djangoSecretKey: ""
  coordinatorApiKey: ""
  apiKey: ""
  postgresPassword: ""
  databaseUrl: ""          # auto-generated from release name if empty
  rabbitmqUser: "ocr"
  rabbitmqPassword: ""
  # Optional dedicated management API account. Leave unset in local labs to
  # reuse the bundled broker account; production KEDA requires a distinct
  # account with RabbitMQ monitoring-only access.
  rabbitmqManagementUser: ""
  rabbitmqManagementPassword: ""
  celeryBrokerUrl: ""      # auto-generated from release name if empty
  redisPassword: ""
  redisUrl: ""             # auto-generated from release name if empty
  celeryResultBackend: ""  # auto-generated from release name if empty
  celeryTaskSigningKey: ""
  flowerPassword: ""
  metricsApiKey: ""
  webhookSecretKey: ""
  piiEncryptionKey: ""
  # S3 secrets (only used when storage.backend == "s3")
  s3Endpoint: ""
  s3Bucket: ""
  s3AccessKey: ""
  s3SecretKey: ""
  s3SessionToken: ""
  s3Region: ""
  presignedTaskKey: ""

# ---------------------------------------------------------------------------
# Inter-service TLS (cert-manager)
# Requires cert-manager CRDs pre-installed in the cluster.
# When enabled, creates a two-tier CA chain and per-service certificates
# for PostgreSQL, RabbitMQ, and Redis.
# ---------------------------------------------------------------------------
tls:
  enabled: false
  certManager:
    issuerKind: Issuer  # or ClusterIssuer

# ---------------------------------------------------------------------------
# Cloud provider configuration (optional)
# Used for provider-specific optimizations (node selectors, tolerations, etc.)
# ---------------------------------------------------------------------------
cloudProvider: "generic"   # "aws", "gcp", "oracle", or "generic"

# ---------------------------------------------------------------------------
# KEDA scaling strategy (applies when any autoscaling.enabled is true)
# ---------------------------------------------------------------------------
keda:
  # RabbitMQ management endpoint used by the HTTP scaler so unacknowledged
  # messages remain visible while workers are processing. The default is for
  # the bundled lab broker; production operators should override this with a
  # trusted HTTPS endpoint and restrict access to the KEDA operator.
  rabbitmqManagementHost: ""
  # For an external broker with a private CA, name a Secret in this release
  # namespace containing the CA at rabbitmqManagementCaSecretKey.
  rabbitmqManagementCaSecretName: ""
  rabbitmqManagementCaSecretKey: ca.crt
  # Namespace where the KEDA operator runs; used only to permit its management
  # API scrape through the optional federation mTLS NetworkPolicy.
  operatorNamespace: keda
  # Scaling strategy affects cooldown, polling, and queue targets:
  #   aggressive  — fast scale-up (10s poll, 60s cooldown, low queue target)
  #   balanced    — default behavior (15s poll, 120-300s cooldown)
  #   conservative — slow scale-up (30s poll, 600s cooldown, high queue target)
  scalingStrategy: "balanced"
  # Global maximum replica count override (per-worker maxReplicas still apply)
  maxReplicaCount: 50
  # Per-scaler queue name overrides (match Celery queue routing configuration)
  gpu:
    queueName: "ocr_gpu"
  cpu:
    queueName: "cpu_general"
  cpuOcr:
    queueName: "ocr_cpu"

# ---------------------------------------------------------------------------
# Webhook configuration
# ---------------------------------------------------------------------------
webhooks:
  # Include PII entity bounding boxes in webhook completion payloads.
  # When enabled, completed job webhooks include an "entities" array
  # with entity_type, confidence_score, page_index, and bounding_box.
  enrichWithEntities: false

# ---------------------------------------------------------------------------
# Prometheus monitoring
# ---------------------------------------------------------------------------
prometheus:
  enabled: true                 # Plan C Phase 0 tuning -- enable Prometheus stack by default
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}
  rules:
    enabled: false
    additionalLabels: {}
  grafana:
    enabled: true               # Plan C Phase 0 tuning -- enable Grafana dashboards by default
    dashboardLabel: grafana_dashboard
    dashboardLabelValue: "1"

# ---------------------------------------------------------------------------
# Monitoring (Plan C Phase 0 alias / consolidated toggles)
# These mirror the per-tool flags above and serve as the documented public
# surface for "is monitoring on" in Plan C Phase 0. The chart still consumes
# `prometheus.enabled` and `prometheus.grafana.enabled` directly.
# ---------------------------------------------------------------------------
monitoring:
  prometheus:
    enabled: true               # Plan C Phase 0 tuning -- monitoring on by default
  grafana:
    enabled: true               # Plan C Phase 0 tuning -- monitoring on by default

# ---------------------------------------------------------------------------
# Coordinator KEDA autoscaling (Plan C Phase 0)
# Controls autoscaling for the coordinator deployment when KEDA is wired up.
# Default `enabled: false` preserves existing behavior; flipping to true
# scales between minReplicas..maxReplicas based on broker queue depth.
# ---------------------------------------------------------------------------
coordinatorAutoscaling:
  enabled: false
  minReplicas: 1                # Plan C Phase 0 tuning -- coordinator min replicas
  maxReplicas: 2                # Plan C Phase 0 tuning -- coordinator max replicas
  pollingInterval: 30           # Plan C Phase 0 tuning -- queue poll interval (seconds)
  cooldownPeriod: 300           # Plan C Phase 0 tuning -- scale-down cooldown (seconds)

# ---------------------------------------------------------------------------
# Pod Disruption Budgets (Plan C Phase 0)
# Documented PDB targets for production. The shipped templates currently use
# fixed `maxUnavailable: 1` per component; these values are the canonical
# Plan C Phase 0 targets and can be wired into templates in a follow-up PR
# without further values.yaml changes.
# ---------------------------------------------------------------------------
pdb:
  coordinator:
    minAvailable: 1             # Plan C Phase 0 tuning -- coordinator PDB target
  gpuWorker:
    maxUnavailable: "25%"       # Plan C Phase 0 tuning -- GPU worker PDB target
  cpuWorker:
    maxUnavailable: "50%"       # Plan C Phase 0 tuning -- CPU worker PDB target
  rabbitmq:
    minAvailable: 2             # Plan C Phase 0 tuning -- RabbitMQ PDB target (HA quorum)
  postgres:
    minAvailable: 1             # Plan C Phase 0 tuning -- Postgres PDB target
  redis:
    minAvailable: 2             # Plan C Phase 0 tuning -- Redis PDB target (Sentinel quorum)

# ---------------------------------------------------------------------------
# Federation (Plan C Phase 1) -- multi-cluster overlay
#
# Opt-in primitives for federated, multi-cluster deployments:
#   * RabbitMQ federation (overflow-only on `ocr_gpu*` and `ocr_cpu` queues)
#   * ArgoCD ApplicationSets for fan-out across clusters
#   * Cluster-identity ConfigMap (cluster name + presigned-URL endpoint +
#     peer-cluster list) consumed by coordinator and workers
#   * NetworkPolicy egress for AMQPS to peer clusters
#
# Defaults: federation.enabled=false. With federation disabled the chart
# renders byte-identically to a non-federated install (all federation
# templates are gated behind `if .Values.federation.enabled`).
#
# Prerequisite (when enabled): RabbitMQ Cluster Operator must already be
# installed in the target cluster. The chart does NOT bundle the operator
# CRDs; it only renders FederationUpstream + Policy custom resources.
#
# Reference: docs/operations/plan-c-phase1-federation.md
# Reference: docs/release-candidate.md (Section 4)
# ---------------------------------------------------------------------------
federation:
  enabled: false                   # master toggle -- default OFF
  clusterName: ""                  # required when enabled (e.g., "prod-us-east-1")
  presignedEndpoint: ""            # this cluster's presigned-URL endpoint exposed to peers
  # ---------------------------------------------------------------------------
  # Plan C Phase 1, item C2 -- expanded peer-cluster registry.
  #
  # `clusters` is the new dynamic peer registry consumed by the federation
  # reconciler (federation-cluster-registry-configmap.yaml). Each entry
  # describes a peer RabbitMQ cluster, its priority/tags, and TLS settings.
  #
  # `upstreamClusters` (legacy, from C1) is preserved for backwards
  # compatibility. When `clusters` is non-empty, it is the authoritative source
  # for the federation control plane; `upstreamClusters` then mirrors a subset
  # of the same data for the static `Federation` CRs the RabbitMQ Operator
  # reconciles. Operators upgrading from C1 should populate both lists with
  # matching entries until C2 reconciler health is proven.
  # ---------------------------------------------------------------------------
  clusters: []                     # list of peer-cluster registrations (C2)
    # - name: prod-eu-west-1
    #   region: eu-west-1
    #   rabbitmq_uri: amqps://federation-user@rabbit.prod-eu-west-1.example.com:5671/%2F
    #   management_uri: https://rabbit.prod-eu-west-1.example.com:15671
    #   priority: 10
    #   tags:
    #     - commercial
    #   tls:
    #     enabled: true
    #     ca_secret_ref: rabbitmq-fed-ca
  queue_classes:                   # queues subject to federation reconciliation (C2)
    - ocr_gpu
    - ocr_cpu
    - nlp
    - translation_batch
  reconciler:
    enabled: true                  # render reconciler Deployment + Service + RBAC
    replicas: 1
    image:
      # Defaults to the coordinator image; override only for custom builds.
      repository: ""
      tag: ""
      digest: ""
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  healthcheck_interval_seconds: 30
  unhealthy_threshold_seconds: 120
  prometheus:
    enabled: true                  # expose /metrics on `port` for Prometheus scrape
    port: 9100
  upstreamClusters: []             # list of {name, amqpUri, presignedEndpoint} (C1, legacy)
    # - name: prod-eu-west-1
    #   amqpUri: amqps://federation-user@rabbit.prod-eu-west-1.example.com:5671/%2F
    #   presignedEndpoint: https://api.prod-eu-west-1.example.com
  queues:
    overflowOnly:                  # federate ONLY these queues; never coordinator
      - ocr_gpu
      - ocr_cpu
    maxOverflowMessages: 10000     # bounded backlog before federation policy kicks in
  argocd:
    enabled: false                 # render ArgoCD ApplicationSet for fleet sync
    applicationSetName: ocr-local-fleet
    namespace: argocd
    project: ocr-local
    repoURL: ""                    # set when enabling ArgoCD
    targetRevision: HEAD
    targetClusters: []             # list of cluster generator entries
      # - cluster: prod-us-east-1
      #   region: us-east-1
      #   tenantClass: commercial
  networkPolicy:
    enabled: true                  # egress AMQPS allowance to peer clusters
    peerCidrs: []                  # list of CIDRs for peer-cluster RabbitMQ endpoints
    amqpsPort: 5671
  # ---------------------------------------------------------------------------
  # Plan C Phase 1, item C4 -- cross-cluster job routing.
  #
  # Multi-strategy router consulted by the Celery callable router at
  # task-dispatch time. With `routing.enabled=false` (default), behaviour is
  # identical to a single-cluster install -- no env vars are injected and the
  # router code path stays cold.
  #
  # Strategies:
  #   local             - always route to local cluster (default)
  #   priority          - highest-priority healthy peer
  #   round_robin       - rotate across healthy peers
  #   load_aware        - prefer peer with lowest messages_unacknowledged
  #   region_affinity   - prefer peer matching kwargs["origin_region"]
  #   custom            - delegate to OCR_FEDERATION_ROUTER_CALLABLE (dotted path)
  # ---------------------------------------------------------------------------
  routing:
    enabled: false                 # master toggle for cross-cluster routing
    strategy: "local"              # local | priority | round_robin | load_aware | region_affinity | custom
    registry_poll_seconds: 30
    load_aware_cache_seconds: 5
    custom_callable: ""            # dotted import path "module.path:attr"
  # ---------------------------------------------------------------------------
  # Plan C Phase 1, item C7 -- DNS-SD federation cluster auto-discovery.
  #
  # When enabled, a Kubernetes CronJob periodically queries DNS-SD (RFC 6763)
  # for peer clusters advertising the `_ocr-federation._tcp` service type and
  # reconciles the result into the federation cluster-registry ConfigMap.
  # The discovery sidecar only touches that one ConfigMap; it does NOT
  # participate in the Celery routing path. Default-OFF.
  # ---------------------------------------------------------------------------
  discovery:
    enabled: false                 # master toggle for DNS-SD discovery
    schedule: "*/5 * * * *"        # CronJob schedule (every 5 minutes by default)
    domain: ""                     # DNS suffix to query (e.g. "clusters.ocr.example.com")
    serviceType: "_ocr-federation._tcp"
    configmapName: "federation-clusters"
    dryRun: false                  # when true, log diffs instead of patching the ConfigMap
  # ---------------------------------------------------------------------------
  # Federation mTLS is unsupported in this chart. Enabling it fails rendering:
  # the certificate scaffolding does not wire mutually authenticated listeners
  # or reconciler identity. Ordinary tls.enabled is server TLS with passwords.
  # Use independently configured/verified external transport for federation.
  # ---------------------------------------------------------------------------
  mtls:
    enabled: false                 # keep false; incomplete transport is rejected
    clusterIssuer: false           # render ClusterIssuer instead of namespaced Issuer
    caRef: ""                      # name of existing CA Secret (skips bootstrap Issuer/CA cert)
    certDuration: 8760h            # leaf cert lifetime (1 year)
    certRenewBefore: 720h          # renew window (30 days)
    coordinatorSan: ""             # additional DNS SAN for coordinator server cert
    rabbitmqSan: ""                # additional DNS SAN for rabbitmq server cert
    peerLabel: "ocr.local/federation-peer"   # NetworkPolicy podSelector label
    custodyPort: 8443              # custody-replication HTTP(S) port (NetworkPolicy ingress)
