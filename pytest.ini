[pytest]
testpaths = tests
python_files = test_*.py
django_find_project = false
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
timeout = 300
markers =
    integration: exercises external services, containers, models, or other long-running runtime paths
filterwarnings =
    ignore::FutureWarning:transformers
    ignore::UserWarning:paddle
    ignore::requests.exceptions.RequestsDependencyWarning
