{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ocr-local.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ocr-local.labels" . | nindent 4 }}
# Generic application pods do not call the Kubernetes API.  Keep their
# projected service-account token out of compromised containers; the
# federation discovery/reconciler components use their own dedicated SAs.
automountServiceAccountToken: false
{{- end }}
