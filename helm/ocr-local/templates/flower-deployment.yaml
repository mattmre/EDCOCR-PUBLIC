{{- if .Values.flower.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-flower
  labels:
    {{- include "ocr-local.labels" . | nindent 4 }}
    app.kubernetes.io/component: flower
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ocr-local.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: flower
  template:
    metadata:
      labels:
        {{- include "ocr-local.labels" . | nindent 8 }}
        app.kubernetes.io/component: flower
    spec:
      serviceAccountName: {{ include "ocr-local.serviceAccountName" . }}
      {{- include "ocr-local.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.flower.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq (include "ocr-local.hasClientCaVolumes" .) "true" }}
      volumes:
        {{- include "ocr-local.tlsCaVolume" . | nindent 8 }}
      {{- end }}
      containers:
        - name: flower
          image: {{ include "ocr-local.coordinatorImage" . }}
          imagePullPolicy: {{ .Values.image.coordinator.pullPolicy | default "IfNotPresent" }}
          command:
            - celery
            - -A
            - coordinator.coordinator
            - flower
            - --port=5555
            # maintenance review: require basic auth for the Flower REST API, not just the UI
            - --unauthenticated_api=false
          ports:
            - name: http
              containerPort: 5555
              protocol: TCP
          # S2-01 / C04: do NOT envFrom the full release Secret (Postgres,
          # Django, S3 keys). Flower only needs broker URL + UI password.
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          env:
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: CELERY_BROKER_URL
            - name: FLOWER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: FLOWER_PASSWORD
            - name: FLOWER_BASIC_AUTH
              value: "admin:$(FLOWER_PASSWORD)"
            # maintenance review: ensure REST API refuses unauthenticated calls even if a
            # reverse proxy later strips the UI basic-auth layer.
            - name: FLOWER_UNAUTHENTICATED_API
              value: "false"
          {{- if eq (include "ocr-local.hasClientCaVolumes" .) "true" }}
          volumeMounts:
            {{- include "ocr-local.tlsCaVolumeMount" . | nindent 12 }}
          {{- end }}
          # S1-A16: Flower UI is basic-auth protected; unauth httpGet never
          # becomes Ready. TCP probe only checks the process is listening.
          readinessProbe:
            tcpSocket:
              port: 5555
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.flower.resources | nindent 12 }}
          {{- with .Values.flower.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
